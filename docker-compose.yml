services:
  plex-tv-picker:
    image: ghcr.io/kepak1/plex-tv-picker:latest
    # To build from source instead, replace the line above with:
    # build: .
    container_name: plex-tv-picker
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./data:/data
